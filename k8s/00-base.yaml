apiVersion: v1
kind: Namespace
metadata:
  name: imgproc
---
# Persistent storage shared by the API pod and every worker pod (/storage/{input,output,thumbnails}).
# hostPath is fine for a single-node local cluster (Docker Desktop / Minikube).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: imgproc-storage-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/imgproc-storage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imgproc-storage-pvc
  namespace: imgproc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: manual
  volumeName: imgproc-storage-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imgproc-config
  namespace: imgproc
data:
  REDIS_URL: "redis://redis:6379/0"
  STORAGE_PATH: "/storage"
  WORKER_LOST_AFTER: "6"
  WORKER_DEPLOYMENT: "image-worker"
  WORKER_POD_SELECTOR: "app=image-worker"
  WORKER_MIN_REPLICAS: "2"
  WORKER_MAX_REPLICAS: "8"
  JOBS_PER_WORKER: "8"
