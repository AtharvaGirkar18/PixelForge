# API access to watch pods and adjust worker replicas from Redis queue depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imgproc-api
  namespace: imgproc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: imgproc-api-scaler
  namespace: imgproc
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imgproc-api-scaler
  namespace: imgproc
subjects:
  - kind: ServiceAccount
    name: imgproc-api
    namespace: imgproc
roleRef:
  kind: Role
  name: imgproc-api-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-api
  namespace: imgproc
spec:
  replicas: 1
  selector:
    matchLabels: {app: image-api}
  template:
    metadata:
      labels: {app: image-api}
    spec:
      serviceAccountName: imgproc-api
      containers:
        - name: api
          image: image-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: imgproc-config}}]
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
          volumeMounts: [{name: storage, mountPath: /storage}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: imgproc-storage-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: image-api
  namespace: imgproc
spec:
  type: NodePort
  selector: {app: image-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
